<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Critical CSS: Fix H1 Deprecation Warning -->
<!-- <style>
/* UA H1-in-section fix */
h1 { 
  font-size: 2em !important; 
  line-height: 1.2; 
  margin: 0.67em 0; 
}
</style> -->


  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="ULsSS9SW0O2t0d76FM20iITO83i9vbTNtTVclZiV7mM" />
  
  <!-- SEO Meta Tags -->
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  
  <!-- Local Business SEO -->
  <meta name="geo.region" content="SG-SG"><!-- Adjust to your region -->
  <meta name="geo.placename" content="Singapore"><!-- Your city -->
  <meta name="geo.position" content="1.3081243;103.8857357"><!-- Your coordinates -->
  
  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <!-- Google tag (gtag.js) - GA4 Measurement ID: G-XTNWTH95L0 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XTNWTH95L0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XTNWTH95L0');
</script>

  
  <!-- Self-hosted Montserrat -->
 <link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}"></noscript>


  <!-- Optional Google Fonts fallback (loaded only if local Montserrat fails) -->
  <script>
    (function () {
      if (!('fonts' in document)) return; // very old browsers just use system fallback

      Promise.race([
        document.fonts.load('1em "Montserrat"'),
        new Promise(function (resolve) { setTimeout(function () { resolve([]); }, 800); })
      ]).then(function (res) {
        if (res && res.length) return; // local Montserrat loaded

        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap';
        document.head.appendChild(l);
      });
    })();
  </script>
  

  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/ico" href="{{ '/favicon.ico' | relative_url }}">
</head>
