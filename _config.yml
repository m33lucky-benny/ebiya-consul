# =========================
# 🌐 SITE BASICS (REQUIRED)
# =========================
title: "Your Site Name"               # 🔴 REQUIRED — shown in browser & SEO
description: "Short SEO description"  # 🔴 REQUIRED — Google meta description
image: "/assets/images/logo.webp"     # OPTIONAL — used for SEO / social cards

# =========================
# 🌍 DOMAIN SETTINGS
# =========================
# For GitHub Pages + custom domain:
# url: "https://yourdomain.com"
# baseurl: ""        # MUST be empty when using custom domain

# For GitHub Pages sub-repo:
# url: "https://username.github.io"
# baseurl: "/repo-name"

url: "https://username.github.io"              # 🔴 REQUIRED — fill before production
baseurl: "repo name"          # 🔴 Leave empty unless using sub-repo

# =========================
# ✍️ AUTHOR / SEO
# =========================
author: ""           # OPTIONAL — used by jekyll-seo-tag

# =========================
# WhatsApp floating button
# =========================
whatsapp:
  enabled: false        # 🔴 REQUIRED to set, to false to hide everywhere, on page in front matter "whatsapp: false", true to show everywhere
  phone: "65XXXXXXXX"  # 🔴 REQUIRED if in use. no +, no spaces,

# =========================
# 🏢 LOCAL BUSINESS (SCHEMA)
# Used for Google rich results
# =========================
business:
  name: "Your Business Name"          # 🔴 REQUIRED for schema
  image: "/assets/images/logo.webp"
  telephone: "+65-XXXXXXXX"            # 🔴 REQUIRED
  email: "hello@yourdomain.com"        # 🔴 REQUIRED
  priceRange: "$$"                     # OPTIONAL ($, $$, $$$)
  address:
    streetAddress: ""                  # OPTIONAL
    addressLocality: ""                # OPTIONAL (City)
    postalCode: ""                     # OPTIONAL
    addressCountry: "SG"               # 🔴 REQUIRED (ISO code)
  url: "/"                             # DO NOT change

# =========================
# 🔌 PLUGINS (SAFE FOR GH PAGES)
# =========================
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# =========================
# 📊 ANALYTICS (OPTIONAL)
# =========================
# google_analytics: "G-XXXXXXXXXX"     # GA4 ID
# google_tag_manager: "GTM-XXXXXXX"    # Use instead of GA if needed
